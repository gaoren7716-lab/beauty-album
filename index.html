<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美人画册 · 离线画廊工作台</title>
<style>
/* ============================================================
 * 深色主题。固定深色，不跟 prefers-color-scheme。
 * 这个库的定位就是「在 IDE 里双击打开」，IDE 主题是暗的，
 * 跟着系统走会出现白底闪一下再变暗 —— 读代码的人会被闪到。
 * 固定深色还省掉一整套变量覆写。
 * ============================================================ */
:root{
  --bg:#0d0f12; --panel:#14171c; --panel2:#1a1e25; --panel3:#222833;
  --ink:#e8eaef; --ink2:#9aa3b0; --ink3:#6b7480;
  --line:#272d36; --line2:#333a45;
  --accent:#d9a05b; --accent-ink:#1a1206; --accent-soft:#2a2118;

  /* 身份层 / 内容层：正交两轴在界面上唯一的颜色编码。
     全站任何地方出现「这个面是谁给的」，都用这两个颜色回答。
     身份层取青、内容层取琥珀 —— 两色在暗底上距离足够远，
     不会与状态色或风险色混淆。 */
  --ident:#5fb3c9; --ident-soft:#16262b; --ident-line:#2c4e57;
  --content:#d9a05b; --content-soft:#2a2118; --content-line:#5a4526;

  /* 状态机四档。written 是默认档，必须能被一眼认出 ——
     它意味着「写得通，但没人验证过它在模型上真的出这个效果」。 */
  --st-collected:#7c8794; --st-written:#6fa8dc;
  --st-tested:#7bbf7b;  --st-reviewed:#5fce85;

  /* 风险四档 */
  --rk-none:#6b7684; --rk-lookalike:#d9a05b;
  --rk-identity:#e06c75; --rk-sensitive:#d08770;

  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Cascadia Mono",monospace;
  --r:9px;
  /* 原生控件（输入框 / 下拉 / 滚动条 / 日历）跟着深色走。
     不写这一行，Chrome 与 Edge 会给表单控件一套白底黑字的系统配色，
     深色页面上就出现一个刺眼的白框 —— 而它偏偏是「用来输入的那一个」。 */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:13.5px/1.62 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0}
code,.mono{font-family:var(--mono)}
/* 表单控件统一深色底。font:inherit 不能省 ——
   不继承的话 textarea 会退回浏览器默认的等宽小字，
   跟旁边的正文不是一套字号，看着像两个界面拼起来的。 */
input,textarea,select{
  background:#0e1116;color:var(--ink);border:1px solid var(--line2);
  border-radius:6px;padding:5px 8px;font:inherit;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:#4a3a22}
/* 需求输入框：写一句话的地方要给足高度。
   rows=4 的框写完三行就得在框里上下滚，
   边写边看不全自己写过什么 —— 于是人会下意识把需求压成半句，
   而需求越短，自动配的命中越少。最小高度按「五行的量」给。 */
.cneed{width:100%;min-height:168px;resize:vertical;line-height:1.85;padding:10px 11px}

/* ---------- 顶栏 ---------- */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:11px 18px 0}
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.hd h1{font-size:16.5px;letter-spacing:.4px;display:flex;align-items:baseline;gap:8px}
.hd h1 .tag{
  font:10px/1.6 var(--mono);letter-spacing:1.6px;color:var(--accent);
  background:var(--accent-soft);border:1px solid #4a3a22;border-radius:4px;padding:1px 7px;
}
.hd .sub{color:var(--ink2);font-size:12px}
.hd .spacer{flex:1}
.hd .stamp{font:11px var(--mono);color:var(--ink3)}
.hd .stamp b{color:var(--accent)}

/* 姓名策略横幅：本库最关键的一条方法论选择，常驻不折叠。
   它是「读这个页面里的任何一条提示词之前就该知道的事」，
   所以放顶栏而不是放进某个设置页。 */
.policy{
  margin:10px 0 0;padding:9px 12px;border-radius:var(--r);
  background:linear-gradient(90deg,#2a1a1c,#241d20);
  border:1px solid #5a2f33;border-left:3px solid var(--rk-identity);
  display:flex;gap:10px;align-items:flex-start;
}
.policy .tag{
  flex:0 0 auto;font:10px/1.6 var(--mono);letter-spacing:1px;
  color:#f0b8bb;background:#3a2124;border:1px solid #6a3a3f;border-radius:4px;padding:2px 7px;
}
.policy .tx{flex:1;min-width:0;font-size:12.5px;color:#f2dcdd;line-height:1.66}
.policy .tx b{color:#fff}
.policy .tx .sub2{color:#c9a4a6;font-size:11.5px;display:block;margin-top:2px}

/* 库存条：全部现算，一个数字都不写死。
   写死的数字在改库那天就开始骗人，而「库存」恰恰是最会变的一项。 */
.inv{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin:10px 0 0;padding-bottom:9px}

.cfgbar{margin:2px 0 8px}
/* 精品出图轴一的段折叠。summary 对齐 tghead 的视觉分量；
   当前选中所在段自动展开，选完收起。 */
.bseg{margin-bottom:5px}
.bseg summary{
  list-style:none;cursor:pointer;user-select:none;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font-size:12px;color:var(--ink2);
}
.bseg summary::-webkit-details-marker{display:none}
.bseg summary:hover{color:var(--ink);border-color:var(--line2)}
.bseg summary small{font:10px var(--mono);color:var(--ink3);margin-left:7px}
.bseg[open] summary{border-color:var(--line2);color:var(--ink)}
.bseg .segbody{padding:8px 2px 2px}
.gfoot .sp{flex:1}
/* 卡片上的一键复制：单独一行，不跟 gfoot 挤在一起 ——
   挤在一行时它会跟类目/风险徽章抢空间，窄卡片下按钮被压成两行，
   看着像坏了。 */
/* 复制设置条：把「复制依赖的三个隐藏状态」摆到画廊页面上 */
.gset{
  display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:8px 0 2px;
  padding:7px 9px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel2);font-size:11px;color:var(--ink3);
}
.gset .lb{font-weight:600;color:var(--ink2)}
.gset .sp{flex:1;min-width:4px}
.gset select{
  max-width:190px;padding:2px 6px;border-radius:5px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  font:11px inherit;
}
.gact{display:flex;align-items:center;gap:6px;margin-top:7px}
/* min-width:0 不能省：flex 子项默认 min-width:auto，
   不归零的话这行文字会把卡片撑宽，网格里出现一列特别宽的卡。 */
.gact .what{
  font:10px var(--mono);color:var(--ink3);min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
/* 两轴说明单独一行：跟两个按钮挤在一行时，196px 的卡片里
   它会被挤成省略号，而「配了哪个主题」恰恰是最不能省的那一段。 */
.gwhat{
  margin-top:5px;font:10px var(--mono);color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.legend{
  display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 2px;font-size:10.5px;color:var(--ink3);
}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- 详情面板 ---------- */
.dhead{padding:11px 12px;border-bottom:1px solid var(--line);background:var(--panel2);border-radius:var(--r) var(--r) 0 0}
.dtitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dtitle b{font-size:16px;letter-spacing:.3px}
.dtitle .en{font:11px var(--mono);color:var(--ink3)}
.dtitle .sp{flex:1}
.dbadges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.kv{margin:7px 0 0;font-size:11.5px;line-height:1.6}
.kv .k{color:var(--ink3);margin-right:5px}
.kv .v{color:var(--ink2)}
.note{
  margin-top:7px;padding:6px 8px;border-radius:6px;font-size:11.5px;line-height:1.62;
  background:#151a1c;border:1px solid var(--line);color:var(--ink2);
  border-left:2px solid var(--line2);
}
.note.warn{background:rgba(217,160,91,.07);border-left-color:var(--rk-lookalike);color:#e2c79b}
.note.hard{background:rgba(224,108,117,.07);border-left-color:var(--rk-identity);color:#eebcc0}
.note b{color:var(--ink)}
.named{
  margin-top:7px;padding:6px 8px;border-radius:6px;font-size:11.5px;
  background:#1c1a1a;border:1px dashed #4a4040;color:var(--ink2);
  display:flex;gap:7px;align-items:baseline;flex-wrap:wrap;
}
.named .nt{font-size:10px;color:#b98d8f;letter-spacing:.5px;flex:0 0 auto;
  border:1px solid #4a3a3a;border-radius:3px;padding:0 5px;background:#241d1d}
.named .nz{color:var(--ink);font-weight:600}

/* 八面逐面展开：身份层与内容层必须一眼分得开。
   左边那根色条就是「这一面来自编号还是主题」的全部答案。 */
.face{
  display:grid;grid-template-columns:4px 1fr;gap:8px;align-items:stretch;
  border:1px solid var(--line);border-radius:7px;margin-top:6px;overflow:hidden;background:#12151a;
}
.face .bar{background:var(--line2)}
.face.id .bar{background:var(--ident)}
.face.mu .bar{background:var(--content)}
.face .fin{padding:6px 8px 7px 2px;min-width:0}
.face .fh{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.face .fk{font-size:11.5px;font-weight:650}
.face.id .fk{color:var(--ident)}
.face.mu .fk{color:var(--content)}
.face .from{
  font:9.5px/1.5 var(--mono);border-radius:3px;padding:0 5px;
  border:1px solid var(--line2);color:var(--ink3);background:var(--panel3);
}
.face.id .from{border-color:var(--ident-line);color:#8fc4d4;background:var(--ident-soft)}
.face.mu .from{border-color:var(--content-line);color:#d9b988;background:var(--content-soft)}
.face .fv{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:3px}
.face .ft{font:10px/1.5 var(--mono);color:var(--ink3);margin-top:2px}
.face.gap{border-style:dashed;border-color:#4a3a2a;background:#17140f}
.face.gap .fk{color:var(--rk-lookalike)}
.fgroup{
  display:flex;align-items:baseline;gap:8px;margin:13px 0 4px;
  font:10px/1.6 var(--mono);letter-spacing:1px;color:var(--ink3);
}
.fgroup .ln{flex:1;height:1px;background:var(--line)}
.fgroup.id b{color:var(--ident);font-weight:400}
.fgroup.mu b{color:var(--content);font-weight:400}

/* 用法指引：never 一段必须最显眼。
   「该改哪一层」这件事不写出来，用户就会去改骨相 ——
   而改完他手里的编号就不存在了。 */
.guide{margin-top:9px;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.guide > div{padding:6px 9px;font-size:11.5px;line-height:1.6;display:flex;gap:8px}
.guide .gk{flex:0 0 54px;font:10px/1.7 var(--mono);letter-spacing:1px}
.guide .gv{flex:1;min-width:0;color:var(--ink2)}
.guide .keep{background:#141c18}.guide .keep .gk{color:var(--st-tested)}
.guide .swap{background:#161a20}.guide .swap .gk{color:var(--ink2)}
.guide .never{background:#241a1b;border-top:1px solid #3a2427}
.guide .never .gk{color:var(--rk-identity)}
.guide .never .gv{color:#f0c8cb}
.guide .hint{padding:6px 9px;border-top:1px solid var(--line);background:var(--panel2);
  font-size:11.5px;color:var(--ink2);line-height:1.62}

/* ---------- 轴工作台 ---------- */
.axis{border:1px solid var(--line);border-radius:7px;background:#12151a;margin-bottom:9px}
.axis > .ah{
  display:flex;align-items:baseline;gap:8px;padding:6px 9px;
  border-bottom:1px solid var(--line);font-size:11.5px;
}
.axis > .ah .ax{font:10px/1.6 var(--mono);letter-spacing:1.2px;color:var(--ink3);flex:0 0 auto}
.axis > .ah b{font-weight:650}
.axis > .ah .d{font-size:10.5px;color:var(--ink3);margin-left:auto;text-align:right}
.axis > .ah i{font-style:normal;font:10.5px var(--mono);color:var(--ink3)}
/* 常显位：只放当前选中的那一张，不横向滚动 ——
   横滚的话「我选了谁」这件事可能滚出视野。 */
.axis .strip{display:flex;gap:4px;padding:8px 9px}

/* ---------- 编号网格卡 ----------
   多行多列，代替单行横滚。
   编号在上（等宽字体）、名字在下截断、右上角色点标气质区——
   网格里竖排信息比横排胶囊好扫：列对齐后编号形成一条竖线，
   眼睛沿竖线扫比沿横线找快得多。

   卡片尺寸是按「手指点得到」定的，不是按「信息塞得下」定的：
   112px 宽 × 三行高的卡，编号与名字挤在一起，
   选号时常常点中隔壁 —— 而这种错位不会报错，
   只会让人以为「我选了这个，出来的是那个人」。
   所以最小宽给到 150px、内边距给到 9px、整卡不低于 54px。 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.pcard{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:8px;padding:9px 11px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;gap:3px;min-width:0;min-height:54px;text-align:left;
}
.pcard .n{font:700 13px var(--mono);display:flex;align-items:center;gap:6px}
.pcard .n .tw{width:12px;height:7px;border-radius:2px;flex:0 0 auto}
.pcard .z{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .rgx{margin-left:auto;font:10px var(--mono);color:var(--ink3);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:66px}
.pcard:hover{border-color:var(--accent);color:var(--ink)}
.pcard.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.pcard.on .z{font-weight:600}
/* 网格容器：给一个看得见边界的高度（约 5 行），
   里面滚动距离短、位置感强 —— 比 80 卡全展开的长页好定位。 */
.pgridbox{max-height:430px;overflow:auto;padding:2px}

/* ---------- 主题网格卡 ----------
   与编号卡同一套尺寸语言：同样的最小宽、同样的内边距、同样的行结构。
   两套选择器长得一样，「选编号」和「选主题」才是同一个动作，
   否则每次换一页都要重新认一遍控件。
   与编号卡的差别只在配色：编号是身份层（琥珀），主题是内容层（青）。
   主题名在上、编号在下 —— 主题是先按名字找的。 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.tcard{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:8px;padding:8px 11px;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;gap:2px;min-width:0;min-height:50px;text-align:left;
}
.tcard .tz{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .tn2{font:10.5px var(--mono);color:var(--ink3)}
.tcard:hover{border-color:var(--content);color:var(--ink)}
.tcard.on{background:var(--content-soft);border-color:var(--content);color:#f0d3a6}
.tcard.on .tz{font-weight:600}
.tcard.on .tn2{color:#c3a077}
/* 主题容器比编号容器矮一点：40 个主题比 80 个编号少一半，
   给一样的高度会造成「还有一半没显示」的错觉。 */
.tgridbox{max-height:340px;overflow:auto;padding:2px}
.tghead{font:10px/1.6 var(--mono);letter-spacing:1px;color:var(--ink3);
  width:100%;margin-top:5px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.modes{display:flex;gap:5px;flex-wrap:wrap}
/* 门类 / 模式按钮：它是轴上的一格，点和编号卡是同一个动作，
   所以内边距与网格卡同一档（不给它单独一套「小一号」的尺寸）。 */
.mbtn{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:8px;padding:8px 12px;cursor:pointer;font-family:inherit;text-align:left;min-height:50px;
}
.mbtn:hover{border-color:var(--accent);color:var(--ink)}
.mbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.mbtn b{display:block;font-size:12.5px}
.mbtn i{font-style:normal;font-size:10px;color:var(--ink3);display:block;margin-top:1px;line-height:1.45}
.mbtn.on i{color:#bda079}
.muse{
  margin-top:6px;padding:6px 8px;border-radius:6px;font-size:11.5px;line-height:1.6;
  background:#12151a;border:1px solid var(--line);color:var(--ink2);
}
.muse b{color:var(--accent)}

/* 出词区 */
.out{margin-top:9px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#0b0d11}
.out .oh{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel2);border-bottom:1px solid var(--line)}
.out .oh .t{font:11px var(--mono);color:var(--accent);letter-spacing:.5px}
.out .oh .sp{flex:1}
/* 出词框：给足高度再限高。
   提示词动辄三四百字，框只有三行高的话
   人得在框里滚着检查自己复制的是不是这一条 ——
   而「复制错了」是这一页最难自查的失败（粘贴出去才发现）。
   最小高度保证短词也有可点的整块区域，最大高度保证长词不把页面撑穿。 */
.out .ob{padding:12px 13px;font:12.5px/1.85 var(--mono);color:#c7cfdb;white-space:pre-wrap;word-break:break-word;
  min-height:170px;max-height:520px;overflow:auto}
.out .of{display:flex;gap:6px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid var(--line);background:var(--panel2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:999px;padding:3px 11px;font-size:11.5px;cursor:pointer;font-family:inherit;
}
.tab:hover{border-color:var(--accent);color:var(--ink)}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  padding:4px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;font-family:inherit;
}
.btn:hover{color:var(--ink);border-color:var(--line2)}
/* ---------- 复制按钮按「复制的是什么」分色 ----------
   出词区里有两个复制按钮，文案一个写「复制本套」一个写「复制负面词」，
   看着分得清，但两者并排放在同一行、长得一模一样，
   手快的人照样会点错 —— 而点错的后果是
   把「不要文字」当成正面词粘进 SD 的 Positive 框。
   颜色是比文案更快的一层判据，所以分色：

     琥珀 p   = 正面词（要画什么）
     红   neg = 负面词（不要画什么）
     青   k   = 别的操作（选中 / 送去精调），不复制任何东西

   红取风险色 --rk-identity 一系：负面词和「这条有风险」在语义上同源
   —— 都是「不要」。复用同一个色系，用户只需要记一次。 */
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.p:hover{opacity:.9}
.btn.neg{border-color:#5f3236;color:#eebcc0;background:#2a1a1c;font-weight:600}

.btn.k{border-color:var(--ident-line);color:#8fc4d4}

.chips{

}
.chips span{font:10.5px var(--mono);color:var(--ink2);background:#12151a;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.warns{display:flex;flex-direction:column;gap:5px;margin-top:8px}

}
.warns .w.ok{background:rgba(123,191,123,.06);border-color:#2c4430;color:#b6d6b6}

/* 组图 / 抽卡 */
.sgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.scard{border:1px solid var(--line);border-radius:7px;background:#12151a;overflow:hidden;display:flex;flex-direction:column}
.scard .st{display:flex;align-items:baseline;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scard .st .pn{font:11px var(--mono);font-weight:700;color:var(--accent)}
.scard .st .tn{font-size:11.5px;font-weight:600}
.scard .st .sp{flex:1}
.scard .sw{height:5px}
.scard .sb{padding:7px 8px;font:10.5px/1.62 var(--mono);color:var(--ink2);flex:1;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.scard .sf{padding:5px 8px;border-top:1px solid var(--line);display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.scard .sdup{font:9.5px var(--mono);color:var(--rk-lookalike);border:1px solid #5c452a;background:#2a2118;border-radius:3px;padding:0 4px}
.tkbox{border:1px solid var(--line);border-radius:7px;background:#12151a;padding:9px;margin-bottom:10px}
.tkbox .tl{font:10px/1.6 var(--mono);letter-spacing:1px;color:var(--ink3);margin-bottom:7px}
.tkstat{display:flex;gap:16px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--ink2)}
.tkstat div{display:flex;flex-direction:column;gap:1px}

.tkstat .v b{color:var(--accent)}

.sw2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:7px}
.toggle{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
  border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--ink2)}

/* 分级说明表 */
.tiergrid{display:grid;gap:8px}

/* toast */

/* ---------- 以下规则自 02:30 备份恢复（误删区间回填） ---------- */

.mtx{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}

/* ---------- 画廊配图（02:30 后新增，误删回填） ---------- */
.ggrid.big{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
@media (min-width:1560px){ .ggrid.big{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))} }
.ggrid.big .gsw{height:360px}

.gpic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;

/* 配图放大浮层（按原始比例完整显示，不裁） */
.pzimg{
  display:block;max-width:100%;max-height:64vh;margin:0 auto;
  border-radius:8px;border:1px solid var(--line2);background:#0b0e12;
}
.pzmeta{margin-top:11px}
.pzrow{display:flex;gap:8px;margin-top:6px;font-size:11.5px;line-height:1.65}
.pzrow .k{flex:0 0 52px;color:var(--ink3)}
.pzrow .v{flex:1;min-width:0;color:var(--ink2)}

.gaps{color:var(--ink2);font-size:11.5px;line-height:1.55;max-width:430px}

/* ============================================================
 * 主布局：顶部横排页签 + 全宽内容
 *
 * 为什么从「左导航三栏」改成「顶部页签 + 一栏」：
 * 三栏时主区被压到 430px，48 张卡片一屏只放得下 6 张，
 * 而画廊的全部价值就是「一眼扫过去」。
 * 详情改成点开浮层：详情是要细读的，浮层给它整块宽，
 * 同时它不再长期占着右栏。
 * 页签全部横排在一行，八个入口都看得见 ——
 * 藏在左栏里的入口等于不存在，用户不会去点一个看不见的页。
 * ============================================================ */
.tabbar{
  display:flex;gap:6px;padding:8px 18px 0;background:var(--panel);
  border-bottom:1px solid var(--line);overflow-x:auto;
  position:sticky;top:0;z-index:20;
}
.tabitem{
  flex:0 0 auto;border:1px solid var(--line);border-bottom:none;background:var(--panel2);
  color:var(--ink2);border-radius:8px 8px 0 0;padding:6px 13px 7px;cursor:pointer;
  font:12.5px/1.5 inherit;display:flex;align-items:baseline;gap:6px;white-space:nowrap;
}
.tabitem:hover{color:var(--ink);border-color:var(--line2);background:var(--panel3)}
.tabitem.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tabitem .n{font:10px var(--mono);opacity:.72}
.tabitem.on .n{opacity:.85}
.tabitem .d{font-size:10px;opacity:.66}
.page{max-width:1720px;margin:0 auto;padding:14px 18px 64px;min-width:0}
.phead{

  padding-bottom:7px;border-bottom:1px solid var(--line);
}
.phead h2{font-size:14px;letter-spacing:.3px}
.phead .hint{font-size:11.5px;color:var(--ink3);margin-left:auto;text-align:right;max-width:56%}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel > h2{
  margin:0;padding:9px 12px;font-size:12.5px;letter-spacing:.4px;
  border-bottom:1px solid var(--line);background:var(--panel2);
  display:flex;align-items:center;gap:8px;
}
.body{padding:11px 12px}
/* ---------- 编号详情浮层 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(6,8,11,.68);z-index:80;display:none;

}

.cmta{

}

.sheet{

}

  border-bottom:1px solid var(--line);background:var(--panel2);border-radius:10px 10px 0 0;
  position:sticky;top:0;z-index:2;
}
.sheet .sh b{font-size:13px}
.sheet .sh .hint{font:11px var(--mono);color:var(--ink3)}
.sheet .sh .sp{flex:1}
.sheet .sbody{padding:11px 12px 14px;overflow:auto}
/* ---------- 小按钮：抽卡的锁 / 重抽 / 一键 ---------- */
.mini{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:5px;padding:2px 7px;font-size:10.5px;cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
.mini:hover{color:var(--ink);border-color:var(--accent)}
.mini.on{background:var(--ident-soft);border-color:var(--ident-line);color:#a8d6e2}
.mini.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.mini.p:hover{opacity:.9}
/* 画廊卡片上的负面词按钮同色：卡片里两个按钮挤在一行，
   只靠文案区分时，「复制提示词」和「负面词」在小卡片上很容易点反。 */
.mini.neg{border-color:#5f3236;color:#eebcc0;background:#2a1a1c;font-weight:600}
.mini.neg:hover{border-color:var(--rk-identity);color:#fff}
.lockbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
/* ---------- 自定义出图 ---------- */
.cgrid{display:grid;gap:11px;grid-template-columns:minmax(300px,.86fr) minmax(340px,1.14fr)}
.cgrid{grid-template-columns:1fr}
.pick{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:6px;padding:4px 9px;font-size:11.5px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:6px;
}
.pick:hover{border-color:var(--accent);color:var(--ink)}
.pick.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.pick .z{font-size:11px}
.pick .n{font:10.5px var(--mono);opacity:.7}
.hit{
  margin-top:8px;padding:7px 9px;border-radius:6px;font-size:11.5px;line-height:1.62;
  background:#12151a;border:1px solid var(--line);color:var(--ink2);
}
.hit b{color:var(--accent)}
.kvline{display:flex;gap:8px;align-items:baseline;font-size:11.5px;margin-top:5px}
.kvline .k{color:var(--ink3);flex:0 0 66px}
.kvline .v{color:var(--ink2);flex:1;min-width:0}
/* ---------- 全部词条 / 体检 ---------- */
.lxgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.lxcard{border:1px solid var(--line);border-radius:7px;background:#12151a;padding:8px 10px}
.lxcard .lh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.lxcard .lh b{font-size:12px}
.lxcard .lh .n{font:10px var(--mono);color:var(--ink3)}
.lxcard .lt{font-size:11.5px;color:var(--ink2);line-height:1.6;margin-top:4px}
.lxcard .lf{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.matrix{width:100%;border-collapse:collapse;font-size:11.5px}
.matrix th,.matrix td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.matrix th{background:var(--panel2);font-weight:600;color:var(--ink2);font-size:11px}
.matrix td.y{color:var(--st-tested)}

.matrix td.w{color:var(--rk-lookalike)}
.row{display:flex;gap:8px;align-items:center}

.filters{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 4px;max-height:140px;overflow:auto}
/* 筛选胶囊也是「要点的东西」：2px 内边距的胶囊只有 ~20px 高，
   在一排八胶囊里点中目标要靠瞄；给到 5px / 12px 后
   它和可点的网格卡差不多大，手不用换精度。 */
.fchip{
  border:1px solid var(--line);background:var(--panel2);color:var(--ink2);
  border-radius:6px;padding:5px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap;font-family:inherit;
}
.fchip:hover{border-color:var(--accent);color:var(--ink)}
.fchip.on{background:var(--accent-soft);border-color:#4a3a22;color:var(--accent);font-weight:600}
.fchip small{font-family:var(--mono);opacity:.72;margin-left:3px}
.secthead{
  display:flex;align-items:baseline;gap:8px;margin:16px 0 7px;
  padding-bottom:5px;border-bottom:1px solid var(--line);
}
.secthead:first-child{margin-top:4px}
.secthead h3{font-size:12.5px}
.secthead .n{font:11px var(--mono);color:var(--ink3)}
.secthead .why{font-size:11px;color:var(--ink3);margin-left:auto;text-align:right;max-width:62%}
.empty{color:var(--ink3);font-size:12px;padding:26px 6px;text-align:center}
/* ---------- 徽章 ---------- */
.badge{
  display:inline-block;font:10px/1.45 var(--mono);border-radius:4px;
  padding:1px 5px;border:1px solid var(--line2);background:var(--panel3);
  color:var(--ink2);white-space:nowrap;vertical-align:1px;
}
.badge.swritten{border-color:#2f4d66;color:var(--st-written);background:#16232c}
.badge.stested{border-color:#31573a;color:var(--st-tested);background:#16241a}
.badge.sreviewed{border-color:var(--st-reviewed);color:#0d0f12;background:var(--st-reviewed);font-weight:700}
.badge.scollected{border-color:#4a4f58;color:var(--st-collected)}
/* written 是默认值，必须能被单独拎出来说：
   「已编写」不等于「已验证」，库里绝大部分条目都停在这一档。 */
.badge.swritten::after{content:" ·未验证";opacity:.72;font-size:9px}
/* 授权四档。颜色直接取 RIGHT_TIERS 的 color，不在界面另抄一份。 */
.tier{
  display:inline-block;font:10px/1.45 var(--mono);border-radius:4px;
  padding:1px 6px;border:1px solid;white-space:nowrap;cursor:help;vertical-align:1px;
}
.rk{
  display:inline-block;font:10px/1.45 var(--mono);border-radius:4px;
  padding:1px 6px;border:1px solid;white-space:nowrap;cursor:help;vertical-align:1px;
}
.rk.rk-none{color:var(--rk-none);border-color:#3a4048;background:#181c21}
.rk.rk-lookalike{color:var(--rk-lookalike);border-color:#5c452a;background:#2a2118}
.rk.rk-identity{color:var(--rk-identity);border-color:#5f3236;background:#2a1a1c}
.rk.rk-sensitive{color:var(--rk-sensitive);border-color:#5e3d33;background:#271e1a}
/* ============================================================
 * 画廊卡片
 *
 * 本库没有一张配图（48 条编号零配图），所以画廊给的是
 * **卡片化的视觉预览**：一块从 skin 描述与 cat 推断出来的色卡，
 * 加上八面的关键词。
 * 为什么推断颜色而不是给每条编号硬编一组色：
 * 48 组各写一遍颜色 = 48 组永远不会被校验的数据 ——
 * 改一条描述色卡不会跟着变，而色卡正是用来「一眼扫」的。
 * 从描述推，描述变了色就跟着变。
 * ============================================================ */
.ggrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(196px,1fr))}
.ggrid{grid-template-columns:repeat(auto-fill,minmax(214px,1fr))}
.gcard{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);
  overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
}
.gcard:hover{border-color:var(--line2)}
.gcard.on{border-color:var(--accent);box-shadow:0 0 0 1px rgba(217,160,91,.34)}
.gsw{position:relative;height:104px;overflow:hidden}
.gsw::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.30),transparent 44%,rgba(0,0,0,.42))}
.gsw .gid{
  position:absolute;left:9px;top:5px;z-index:2;
  font:700 27px/1 var(--mono);letter-spacing:-.5px;color:#fff;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}
.gsw .gid em{font-style:normal;font-size:9.5px;opacity:.72;letter-spacing:1.4px;display:block;font-weight:400;margin-bottom:1px}
.gsw .gtier{position:absolute;right:7px;top:7px;z-index:2}
.gstrips{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;height:9px}
.gstrips i{flex:1;display:block}
.gbody{padding:8px 9px 9px}
.gname{font-size:13.5px;font-weight:650;letter-spacing:.2px;line-height:1.3}
.gname em{font-style:normal;font-size:10px;color:var(--ink3);font-family:var(--mono);margin-left:5px;font-weight:400}
.gkw{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;min-height:34px}
.gkw span{
  font:10px/1.5 var(--mono);padding:1px 5px;border-radius:4px;
  background:#12151a;border:1px solid var(--line);color:var(--ink2);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.gkw span.id{color:#8fc4d4;border-color:var(--ident-line);background:var(--ident-soft)}
.gkw span.mu{color:#d9b988;border-color:var(--content-line);background:var(--content-soft)}
.gfoot .cat{color:var(--ink2)}
</style>

<header>
  <div class="hd">
    <h1>美人画册<span class="tag">BEAUTY ALBUM</span></h1>
    <span class="sub">编号 = 一个完整可复现的人物配方 · 主题 = 换什么内容 · 两轴正交 · 离线双击即用</span>
    <span class="spacer"></span>

<script>
/* ============================================================
 * 美人画册 · 界面
 *
 * 状态只有一份：S。任何操作都是改 S 再 render()。
 * 这么做的好处是「复现一屏」退化成序列化 S，
 * 而不需要额外维护一份历史栈。
 *
 * 五条不能省的呈现纪律（全库反复强调，界面必须兑现）：
 *   1. 姓名不进提示词 —— 顶栏常驻横幅 + 每条编号的 namedRef 处再声明一次
 *   2. 授权档与风险标记 —— 每条编号露出，出词时汇总
 *   3. 状态标注 —— written / tested / reviewed 一眼可辨，
 *      且 written 明说「写得通但没人在模型上验证过」
 *   4. 身份层 / 内容层分色 —— 每一面都标出来自编号还是主题

(function () {

/* ---------- 取全局符号 ----------

   直接写裸标识符在符号缺失时是 ReferenceError，整页脚本全挂 ——
   那种失败方式比「这一块显示不出」糟得多。 */
var G = (typeof window !== "undefined") ? window : this;
function need(name) {
  var v = G[name];
  if (v === undefined) {
    console.error("[beauty-album] 缺少全局符号 " + name
      + " —— 检查 index.html 里的 script 顺序与文件是否存在");
  }
  return v;
}

var KIT   = need("ALBUMKIT");
var GACHA = need("GACHA");
/* RIGHTS 走 need() 而不是裸标识符：data-core.js 里也有一个
   叫 RIGHTS 的容器数组，rights.js 加载时会把同一个全局绑定覆盖成
   模块对象。浏览器里它们是同一个 window 属性 ——
   所以这里拿到的必须确认是带 inspect 的那一个，见 boot()。 */
var RIGHTS = need("RIGHTS");

/* ---------- 数据库 ----------
   Node 侧由 tools/_load.js 建 db，浏览器端必须自己拼一份。
   DEFAULT_NEG 的真源在 tools/_load.js 里（assets 中没有），
   所以这一份是本文件里唯一一处「与 Node 侧重复的数据」——
   重复的理由是 file:// 下无法 require CommonJS 模块。
   改动时必须同步改 tools/_load.js，否则网页与命令行出的负面词不一样，
   而这种差异极难发现：两边都能跑、都能出图，只是差了几个词。 */
var DB = {
  ALBUM: G.ALBUM, THEMES: G.THEMES, MODES: G.MODES, MEDIUMS: G.MEDIUMS,
  ALBUM_FACES: need("ALBUM_FACES"), IDENTITY_FACES: need("IDENTITY_FACES"),
  RENDER_MODES: need("RENDER_MODES"), RIGHT_TIERS: need("RIGHT_TIERS"),
  ALBUM_TAXO: need("ALBUM_TAXO"), THEME_TAXO: need("THEME_TAXO"),
  MEDIUM_RULE: need("MEDIUM_RULE"),
  RISK_KINDS: need("RISK_KINDS"), NAME_POLICY: need("NAME_POLICY"),
  STATUS: need("STATUS"), INFO_KINDS: need("INFO_KINDS")
};
DB.DEFAULT_NEG = [
  "低分辨率", "解剖错误", "多手指", "多余肢体", "面部畸变",
  "不对称眼睛", "文字", "水印", "签名", "logo", "边框"
];
DB.KIT = KIT;
DB.GACHA = GACHA;

/* ---------- 派生索引 ---------- */
var TIER = {}, RISK = {}, ST = {};
(DB.RIGHT_TIERS || []).forEach(function (t) { TIER[t.k] = t; });
(DB.RISK_KINDS  || []).forEach(function (r) { RISK[r.k] = r; });
(DB.STATUS      || []).forEach(function (s) { ST[s.k] = s; });

var PLATE = {};   /* num → plate */
var THEME = {};   /* num → theme */
(DB.ALBUM || []).forEach(function (p) { if (p && p.num) PLATE[p.num] = p; });
(DB.THEMES || []).forEach(function (t) { if (t && t.num) THEME[t.num] = t; });
function themeOfNum(n) { return THEME[n] || null; }

var FACES = DB.ALBUM_FACES || [];

/* ============================================================
 * 色卡推断
 *
 * 从 cat 拿大基调，从 skin 描述拿冷暖与明度的偏移。
 * 为什么推断而不是给 48 条各编一组色：48 组手写的颜色
 * 永远不会有人校验，改了描述色卡不会跟着变 ——
 * 而色卡在这里的全部价值就是「一眼扫过去分出气质区」。
 * ============================================================ */
var CAT_TONE = {
  "冷调锐利": { h: 206, s: 30, l: 44 },
  "暖调柔和": { h: 30,  s: 44, l: 55 },
  "中性硬朗": { h: 218, s: 13, l: 41 },
  "明艳":     { h: 344, s: 58, l: 53 },
  "少年感":   { h: 166, s: 27, l: 60 },
  "古典":     { h: 38,  s: 36, l: 39 }
};
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function toneOf(p) {
  var b = CAT_TONE[p.cat] || { h: 210, s: 22, l: 46 };
  var h = b.h, s = b.s, l = b.l;
  var d = ((p.faces || {}).skin || {}).c || "";
  if (/冷|青/.test(d))          { h = 206; s += 4; }
  if (/暖|蜜|象牙/.test(d))     { h = 28;  s += 7; }
  if (/深|暗/.test(d))          { l -= 13; }
  if (/白皙|浅|苍白|清透/.test(d)) { l += 11; }
  if (/油光|反光|带光/.test(d))  { s += 9; }
  if (/哑光|均匀|无油光/.test(d)) { s -= 8; }
  return { h: h, s: clamp(s, 4, 80), l: clamp(l, 20, 76) };
}
function hsl(t, dl, ds) {
  return "hsl(" + t.h + "," + clamp(t.s + (ds || 0), 3, 90) + "%,"
       + clamp(t.l + (dl || 0), 10, 92) + "%)";
}
function swatchOf(p) {
  var t = toneOf(p);
  return "linear-gradient(150deg," + hsl(t, 16, -4) + " 0%,"
       + hsl(t, 0, 0) + " 48%," + hsl(t, -18, 6) + " 100%)";
}
/* 八条面色条：身份层走冷色系、内容层走琥珀系。
   这样卡片本身就是「正交机制」的示意图 ——
   前五条同族、后三条另一族，跟引擎里的分组完全一致。 */
function stripsOf(p) {
  var t = toneOf(p), out = [];
  FACES.forEach(function (f, i) {
    out.push(f.group === "identity"
      ? hsl({ h: t.h + i * 5 - 12, s: clamp(t.s + 8, 4, 86), l: clamp(t.l + 18 - i * 4, 16, 88) })
      : hsl({ h: 26 + i * 14, s: 48 + i * 5, l: 42 + i * 6 }));
  });
  return out;
}
/* 窄条里的编号色条 */
function chipTone(p) {
  var t = toneOf(p);
  return hsl({ h: t.h, s: clamp(t.s + 10, 6, 88), l: clamp(t.l + 6, 18, 72) });
}

/* 关键词：取描述的第一个意群。
   为什么不全句塞进标签：卡片正面要能一眼扫完，
   一句二十字的话塞进 chip 里等于没有 chip。 */
function kwOf(face, n) {
  var s = face && face.c ? String(face.c) : "";
  s = s.split(/[，,。；;、：:（(【]/)[0];
  s = s.trim();
  return s.length > n ? s.slice(0, n) : s;
}

/* ============================================================
 * 状态
 * ============================================================ */
var S = {
  view: "gallery",
  /* 详情浮层 */
  det: false,
  /* 画廊 */
  q: "", cat: "全部", tier: "全部", rk: "全部",
  /* 地域筛选：region 是编号的正交维度 —— 它回答「她从哪个文化圈来」，
     与 cat（审美印象）不同层。原型段（001–048）region 为空，
     筛「全球段」时会正确地被排除，不靠字符串硬猜。 */
  region: "全部",
  /* 画廊密度：big = 看图（默认，用户来画廊多半是看图不是背编号），
     dense = 扫编号（一屏 48 个）。
     两档都留着是因为 48 张里只有 1 张配图 ——
     只留 big 的话，那 47 张色卡会被撑到比图还大，很怪。 */
  gview: "big", picOnly: false,
  /* 四轴条与画廊筛选的折叠态：默认收起，给小白一条没有岔路的主干道 */
  advAxis: false, moreFilters: false,
  /* 一句话出图自己的门类选择（与全局解耦：它的编号是自动配的，
     门类也该由本页流程决定）；画廊的复制配置折叠态。 */
  cMedium: "photo", copyCfg: false,
  /* 两轴（画廊选中与工作台共用同一个编号） */
  num: (DB.ALBUM[0] || {}).num || null,
  theme: (DB.THEMES[0] || {}).num || null,
  mode: "plain", plat: "gpt", medium: "photo",
  /* 组图 */
  swCat: "全部", swPicked: {}, swOut: null,
  /* 抽卡 */
  gN: 8, gSeed: "", gSemantic: true, gForce: false, gCat: "全部",
  gRolls: null,
  /* 抽卡的锁：key = 组下标，value = {plate:true, theme:true, mode:true}
     锁住某一轴后重抽不换它 —— 抽卡的乐趣在「换一个轴看看」，
     而不是每次都整组推翻重来。 */
  gLocks: {},
  /* 自定义出图 */
  cText: "", cNum: null, cTheme: null, cMode: "plain",
  cRatio: "3:4", cAppend: true, cAuto: null,
  /* 全部词条 */
  lxTab: "plate"
};

var el = function (id) { return document.getElementById(id); };
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/[&<>"]/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
}
function clip(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n) + "…" : s;
}

/* ---------- 复制 ----------
   file:// 下 navigator.clipboard 常常不可用（不是安全上下文），
   所以一定要留 execCommand 兜底，而且两路都要 try ——
   剪贴板失败不该让界面报错。 */
/* 复制：成败必须真判定了再报喜，不能一调用就说「已复制」。
 *
 * navigator.clipboard.writeText 返回的是 Promise —— 「调用了」不等于「写进去了」。
 * Firefox 下 file:// 也算可信任来源，clipboard 是存在的，但写入会被拒：
 * 那时如果照旧弹「已复制」，用户看到的是成功、剪贴板里是空的，
 * 而且没有任何东西报错（rejection 没人接，静悄悄丢掉）。
 * 这条失败最坏的地方在于**没有症状** —— 他会一直以为是模型的问题。
 *
 * 所以三条路都走完才说话：
 *   ① clipboard 写入成功           → 报成功
 *   ② 被拒 / 不存在                → 回落 execCommand（file:// 双击打开的真实路径）
 *   ③ 两条都失败                   → 摊开全文让他手动 Ctrl+C
 */
function copyText(txt, note) {
  txt = (txt == null ? "" : String(txt));
  var okMsg = "已复制" + (note ? " " + note : "") + "（" + txt.length + " 字）";
  function done(good) {
    if (good) toast(okMsg);
    else manualCopyBox(txt, note);
    return good;
  }
  var p = null;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      p = navigator.clipboard.writeText(txt);
    }
  } catch (e) { p = null; }
  /* 返回了 Promise：等它 settle 再决定说什么，此处不能给返回值 ——
     给一个「多半是真的」的布尔值，比不给更糟，调用方会拿它去报喜。 */
  if (p && typeof p.then === "function") {
    p.then(function () { done(true); }, function () { done(fallbackCopy(txt)); });
    return;
  }
  if (p) { done(true); return; }   /* 同步返回非 Promise 的实现：当成成功 */
  done(fallbackCopy(txt));
}

/* 老路子：塞一个屏幕外的 textarea，选中，execCommand。
   execCommand 已废弃但仍是 file:// 下唯一能用的自动复制手段。 */
function fallbackCopy(txt) {
  try {
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position = "fixed"; ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = !!document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* 兜底的兜底：把全文摊开。
   不摊开的话，「复制被拒绝」这句提示是空的 —— 内容是现算的，
   界面上没有它的全文，用户无从手动复制。 */
function manualCopyBox(txt, note) {
  var box = el("cmask"), ta = el("cmText");
  if (!box || !ta) { toast("复制被浏览器拒绝，且无法摊开全文"); return; }
  el("cmHint").textContent = note || "";
  el("cmWhy").innerHTML = "<b>浏览器拒绝了自动写入剪贴板。</b>"
    + "这在本库双击打开（<code>file://</code>）时最常见 —— "
    + "浏览器不把本地文件当可信任来源。"
    + "下面已经全选好了，按 <b>Ctrl+C</b>（Mac ⌘C）即可；"
    + "也可以把整页部署到 <code>https</code> 下，自动复制就能用。";
  ta.value = txt;
  box.classList.add("on");
  try { ta.focus(); ta.select(); } catch (e) {}
}
function closeCopyBox() { var b = el("cmask"); if (b) b.classList.remove("on"); }
var toastTimer = null;
function toast(msg) {
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1500);
}

/* ---------- 徽章 ---------- */
function tierBadge(k) {
  var t = TIER[k];
  if (!t) return "";
  return '<span class="tier" style="color:' + t.color + ";border-color:" + t.color
    + ";background:" + t.color + '22" title="' + esc(t.desc + "｜能做什么：" + t.can) + '">'
    + esc(t.k) + " " + esc(t.zh) + "</span>";
}
function riskBadge(k) {
  var r = RISK[k];
  if (!r) return "";
  return '<span class="rk rk-' + esc(k) + '" title="' + esc(r.desc) + '">' + esc(r.zh) + "</span>";
}
function statusBadge(p) {
  var k = p.status || "written";
  var s = ST[k];
  return '<span class="badge s' + esc(k) + '" title="'
    + esc(s ? s.desc : k) + '">' + esc(s ? s.zh : k) + "</span>";
}

/* ---------- 计数（全部现算） ---------- */
function countsOf(list, key) {
  var m = {}, total = 0;
  list.forEach(function (x) {
    var v = x[key];
    if (v == null) return;
    m[v] = (m[v] || 0) + 1; total++;
  });
  return { m: m, total: total };
}
/* ---------- 归类的唯一入口 ----------
   所有「有哪些类目、按什么顺序列」的问题都走这两个函数，
   答案来自 data-core.js 的 ALBUM_TAXO / THEME_TAXO，不是从数据里现算。

   为什么不现算：现算出来的顺序 = 数据里首次出现的顺序。
   那等于把「001 为什么是冷调锐利」这条编排决定藏进了文件行序 ——
   有人在中间插一条，整张分组表的顺序就跟着变，而且一声不响。
   类目是给读者认路的地图，它必须写在一个能被人读到的地方。

   出现过但不在册的类目**不丢**，接到末尾并标出来 ——
   直接丢弃的话，新加的类目会在所有筛选里静默消失，
   界面表现只是「少了几张卡」，没人会往「归类没登记」上想。 */
function taxoOrder(declared, seen) {
  var out = declared.slice();
  seen.forEach(function (k) { if (out.indexOf(k) < 0) out.push(k); });
  return out;
}
function sortedCats(list) {
  var seen = [], m = {};
  list.forEach(function (x) { if (x.cat && !m[x.cat]) { m[x.cat] = 1; seen.push(x.cat); } });
  return taxoOrder(((DB.ALBUM_TAXO || {}).kinds || []), seen);
}
function cultureCircles(list) {
  var seen = [], m = {};
  list.forEach(function (x) { if (x.region && !m[x.region]) { m[x.region] = 1; seen.push(x.region); } });
  return taxoOrder(((DB.ALBUM_TAXO || {}).circles || []), seen);
}
/* 主题按 cat 分组。顺序来自 THEME_TAXO（八类的编排顺序），
   不按拼音、不按数量 —— 库的编排顺序本身就是「按场景区排的」，
   打乱它等于把作者的信息丢掉。 */
function themeGroups() {
  var m = {}, order = [];
  (DB.THEMES || []).forEach(function (t) {
    if (!m[t.cat]) { m[t.cat] = { cat: t.cat, list: [] }; order.push(t.cat); }
    m[t.cat].list.push(t);
  });

/* ============================================================
 * 三 精品出图（逐项手选）
 * ============================================================ */
/* ---------- 编号分组表 ----------
   全库只有这一份「编号怎么分组」，精品出图 / 一句话出图 / 组图 三页共用。
   三页各拼一次的话，改一次分组要改三处，漏一处就是
   「同一个编号在两页里不在同一组」——而这种不一致不会报错。

   两段的分组键不同，这是有意的，不是偷懒：
     原型段 → 按气质六类（cat）      ：这一段本来就是按气质区排的
     全球段 → 按文化圈八圈（region）：这一段是先按圈铺的广度
   分组键的顺序一律取 ALBUM_TAXO，不取数据里首次出现的顺序。 */
function groupTables() {
  var proto = [], globe = [];
  (DB.ALBUM || []).forEach(function (p) {
    (p.region ? globe : proto).push(p);
  });
  /* 按声明顺序分组。不在册的类目接在末尾，不丢条目。 */
  function groupBy(list, order, keyFn) {
    var seen = [], map = {};
    list.forEach(function (p) {
      var k = keyFn(p);
      if (!map[k]) { map[k] = []; seen.push(k); }
      map[k].push(p);
    });
    return taxoOrder(order, seen).map(function (k) {
      return { title: k, list: map[k] || [] };
    }).filter(function (g) { return g.list.length > 0; });
  }
  return [
    { title: "原型段 · 不限地域的类型", list: proto,
      groups: groupBy(proto, ((DB.ALBUM_TAXO || {}).kinds || []), function (p) { return p.cat; }) },
    { title: "全球段 · 按文化圈", list: globe,
      groups: groupBy(globe, ((DB.ALBUM_TAXO || {}).circles || []), function (p) { return p.region; }) }
  ].filter(function (g) { return g.list.length > 0; });
}

/* ---------- 一张编号卡 ----------
   三个编号选择器共用同一个渲染函数（同一张卡在三页里长得一样）。

   卡面右上角的小标 rgx 取的是**这张卡自己的细类**，
   不是「当前选中的那条属于哪个段」——
   早先这里是按当前选中判断的，于是选中全球段某条时，
   原型段 48 张卡的小标全变空白，看着像那 48 条没有归类。
   归类信息跟着卡片走，跟着选中走就会在别的卡上撒谎。
     · 全球段：标 culture（唐 / 波斯 / 毛利…）—— 圈名已由组标题给了，
       卡上再给圈名是重复，给细类才是新信息
     · 原型段：标 cat（气质区）—— 组标题同样是 cat，但卡上带一条，
       扫到跨段结果时不用回头看标题 */
function plateSub(p) {
  return p.culture || p.cat || "";
}
function plateCard(x, act, selNum, extraStyle) {
  return '<button class="pcard' + (selNum === x.num ? " on" : "") + '" data-act="' + act
    + '" data-num="' + x.num + '"'
    + ' title="' + esc((x.region ? x.region + " · " : "") + x.cat + " · " + x.zh) + '"'
    + (extraStyle ? ' style="' + extraStyle + '"' : "") + '>'
    + '<span class="n"><span class="tw" style="background:' + chipTone(x) + '"></span>'
    + '<span class="nn">' + esc(x.num) + '</span>'
    + '<span class="rgx">' + esc(plateSub(x)) + "</span></span>"
    + '<span class="z">' + esc(x.zh) + "</span></button>";
}
/* 一段折叠里的全部卡（组标题 + 网格）。open 由调用方按「选中在哪段」给。 */
function segHTML(g, act, selNum, open) {
  var chips = g.groups.map(function (grp) {
    return '<div class="tghead">' + esc(grp.title) + " · " + grp.list.length + "</div>"
      + '<div class="pgrid">' + grp.list.map(function (x) {
          return plateCard(x, act, selNum);
        }).join("") + "</div>";
  }).join("");
  return '<details class="bseg"' + (open ? " open" : "") + '><summary>'
    + esc(g.title) + "<small>" + g.list.length + " 条</small></summary>"
    + '<div class="segbody"><div class="pgridbox">' + chips + "</div></div></details>";
}
/* 编号选择器：当前选中常显 + 两段折叠。三页共用。 */
function platePicker(act, selNum) {
  return groupTables().map(function (g) {
    var here = g.list.some(function (x) { return x.num === selNum; });
    return segHTML(g, act, selNum, here);
  }).join("");
}

/* ---------- 主题选择器 ----------
   主题也从「一行横排胶囊」改成多行网格卡：
   40 个胶囊换行排下来，一屏只能看到两行，找一个主题要滚很久，
   而胶囊宽度跟着文字长短变，列不对齐，眼睛没有可沿之扫的竖线。
   网格卡宽度一致后，编号那一行自然形成竖线。

   精品出图轴二（单选 tnum）/ 一句话出图手选（ctheme）/
   组图勾选（swpick，可多）三处共用同一张卡，只是 on 的判据不同：
   单选看「是不是当前」，多选看「有没有勾上」。 */
function themeCard(t, act, selNum, picked) {
  var on = picked ? !!picked[t.num] : (selNum === t.num);
  return '<button class="tcard' + (on ? " on" : "") + '" data-act="' + act + '" data-num="'
    + t.num + '" title="' + esc(t.text || "") + '">'
    + '<span class="tz">' + esc(t.zh) + "</span>"
    + '<span class="tn2">' + esc(t.num) + "</span></button>";
}
/* catFilter 给组图用（只显示当前类目）。 */
function themeGridHTML(act, selNum, picked, catFilter) {
  return themeGroups().map(function (g) {
    if (catFilter && catFilter !== "全部" && g.cat !== catFilter) return "";
    return '<div class="tghead">' + esc(g.cat) + " · " + g.list.length + "</div>"
      + '<div class="tgrid">' + g.list.map(function (t) {
          return themeCard(t, act, selNum, picked);
        }).join("") + "</div>";
  }).join("");
}

function renderBench() {
  el("mainH").innerHTML = "精品出图<span class=\"hint\">逐项手选，实时出词</span>";

  var p = PLATE[S.num];
  var f = "";

  /* 页面关系的说明放在轴一上方 —— 新用户最常见的困惑是
     「这几个页面是不是各管各的、我在这里改了那边知道吗」。
     答案必须写在界面上：四页共享同一套轴，改一处处处生效。
     写在 README 里不算数，困惑发生在页面上。 */
  f += '<div class="note">这四页共用<b>同一套当前选择</b>：'
    + "画廊选的人、这里调的轴、一句话出图自动配的编号、抽卡抽到的组合，"
    + "改任何一处，其他页的复制与出词都会跟着变 —— "
    + '顶栏末尾的「此刻：…」随时显示当前组合。</div>';

  if (!p) { el("main").innerHTML = '<div class="empty">库里没有可用编号</div>'; return; }

  /* 轴一：编号。80 条平铺是「翻不完的一面墙」，
     所以按段折叠：当前选中永远可见（不用展开就能确认自己选了谁），
     两个段（原型段六类 / 全球段八圈）各自折叠，点开才出 chips。
     选完自动收起 —— pnum 事件里关闭 details。
     组表由 groupTables() 现算，全球段扩圈时不用改这里。 */
  /* 当前选中常显：不用展开就能确认自己选了谁。 */
  var cur = plateCard(p, "pnum", p.num, "max-width:190px");
  f += '<div class="axis"><div class="ah"><span class="ax">轴一</span><b>编号</b>'
    + '<i>' + (DB.ALBUM || []).length + " 条</i>"
    + '<span class="d">决定这个人是谁 · 身份层五面由它定，主题改不了</span></div>'
    + '<div class="strip" style="margin-bottom:6px">' + cur + "</div>"
    + platePicker("pnum", p.num) + "</div>";

  /* 轴二：主题。按 cat 分组成网格，40 个全列出。 */
  var th = themeOfNum(S.theme);
  f += '<div class="axis"><div class="ah"><span class="ax">轴二</span><b>主题</b>'
    + '<i>' + (DB.THEMES || []).length + " 个</i>"
    + '<span class="d">决定画什么 · 覆盖妆造与场景，不动身份层</span></div>'
    /* tgridbox 默认只有 2px 内边距（它多半嵌在已经有 padding 的容器里）；
       直接放在 .axis 里就要自己补，否则卡边贴着轴框 —— 看着像没画完。 */
    + '<div class="tgridbox" style="padding:8px 9px 2px">'
    + themeGridHTML("tnum", S.theme, null) + "</div>"
    + '<div class="body" style="padding:0 9px 9px"><div class="note">'
    + (th ? "<b>" + esc(th.cat) + " · " + esc(th.zh) + "　</b>" + esc(th.text || "")
         + (th.faces && th.faces.hair
            ? '<br>本主题指定了发型 —— hair 面会被覆盖（soft 面：主题写了才覆盖）' : "")
       : "当前没有主题 —— 词面里不会有场景面，编号单独出图")
    + "</div></div></div>";

  /* 轴三：门类。
   它排在模式前面不是编号顺序问题，是依赖关系：
   门类先定「怎么画」，模式再定「成品有没有字」。
   先定成品形态再定画法，顺序是反的。 */
  var medBtns = (DB.MEDIUMS || []).map(function (m) {
    return '<button class="mbtn' + (S.medium === m.k ? " on" : "") + '" data-act="medium" data-v="'
      + m.k + '" title="' + esc(m.desc + (m.caution ? "\n\n注意：" + m.caution : "")) + '">'
      + "<b>" + esc(m.zh) + "</b><i>" + esc(m.desc || "") + "</i></button>";
  }).join("");
  var md = (DB.MEDIUMS || []).filter(function (m) { return m.k === S.medium; })[0];
  f += '<div class="axis"><div class="ah"><span class="ax">轴三</span><b>视觉门类</b>'
    + '<i>' + (DB.MEDIUMS || []).length + " 种</i>"
    + '<span class="d">决定这张图怎么画出来 · 改写身份层的表达方式，但不改她是谁</span></div>'
    + '<div class="body"><div class="modes">' + medBtns + "</div>"
    + (md && md.caution ? '<div class="muse warn"><b>这个门类画不出来的东西　</b>'
      + esc(md.caution) + "</div>" : "")
    + "</div></div>";

  /* 模式：四个按钮，每个都带 useWhen —— 为什么分模式是这里最要紧的一句。 */
  var modeBtns = (DB.MODES || []).map(function (m) {
    return '<button class="mbtn' + (S.mode === m.k ? " on" : "") + '" data-act="mode" data-v="' + m.k + '" title="'
      + esc(m.desc || "") + '"><b>' + esc(m.zh) + "</b><i>" + esc(m.desc || "") + "</i></button>";
  }).join("");
  var mo = (DB.MODES || []).filter(function (m) { return m.k === S.mode; })[0];
  f += '<div class="axis"><div class="ah"><span class="ax">轴四</span><b>呈现模式</b>'
    + '<i>' + (DB.MODES || []).length + " 种</i>"
    + '<span class="d">决定要不要写字 · 不碰身份层，换了模式她还是那个人</span></div>'
    + '<div class="body"><div class="modes">' + modeBtns + "</div>"
    + (mo ? '<div class="muse"><b>什么时候用　</b>' + esc(mo.useWhen || "") + "</div>" : "")
    + "</div></div>";

  /* 实时出词 */
  f += outHTML();

  el("main").innerHTML = f;
}

function composeNow() {
  return KIT.compose(DB, S.num, { themeId: S.theme, mode: S.mode, medium: S.medium });
}
function outHTML() {
  var r = composeNow();
  if (!r.ok) {
    return '<div class="out"><div class="ob">' + esc(r.why || "出词失败") + "</div>"
      + ((r.cand || []).length
          ? '<div class="of">最近候选：' + r.cand.map(function (c) {
              return '<button class="btn" data-act="pnum" data-num="' + c.num + '">'
                + esc(c.num + " " + c.zh) + "</button>";
            }).join("") + "</div>"
          : "") + "</div>";
  }
  var tags = (r.tags && r.tags[S.plat]) || [];
  var body = (S.plat === "nl") ? r.nl : tags.join("，");
  var meta = { sd:"Stable Diffusion", mj:"Midjourney", flux:"FLUX", nl:"自然语言", gpt:"GPT 图像" };

  var tabs = Object.keys(KIT.PLATFORMS || {}).map(function (k) {
    return '<button class="tab' + (S.plat === k ? " on" : "") + '" data-act="plat" data-v="' + k + '">'
      + esc(k.toUpperCase()) + "</button>";
  }).join("");

  var h = '<div class="out">'
    + '<div class="oh"><span class="t">' + esc(meta[S.plat] || S.plat) + "</span>"
    + '<span class="badge">' + esc(r.plate.num) + "</span>"
    + (r.theme ? '<span class="badge" style="color:#d9b988;border-color:var(--content-line);background:var(--content-soft)">'
        + esc(r.themeId || S.theme) + "</span>" : "")
    + '<span class="badge">' + esc(r.mode.zh) + "</span>"
    + '<span class="sp"></span>' + tierBadge(r.plate.rights) + "</div>"

    /* 面来源表：身份层与内容层分色，每面标出来自编号还是主题。
       这一块是「正交机制在起作用」最直接的证据。 */
    + '<div class="chips">' + FACES.map(function (f) {
        var x = r.faces[f.k];
        if (!x || !x.c) return "";
        var cl = f.group === "identity" ? "id" : "mu";
        return '<span class="fc ' + cl + '" data-face="' + f.k + '" data-src="' + esc(x.from) + '" data-txt="'
          + esc(x.c) + '" style="color:' + (cl === "id" ? "#8fc4d4" : "#d9b988")
          + ';background:' + (cl === "id" ? "var(--ident-soft)" : "var(--content-soft)")
          + ';border-color:' + (cl === "id" ? "var(--ident-line)" : "var(--content-line)") + '">'
          + esc(f.zh) + " · " + esc(x.from) + "</span>";
      }).join("")
    + '<span style="color:var(--ink3);border-color:var(--line);background:var(--panel2)">'
    + (r.loose || []).map(function (x) { return esc(x.from) + " " + clip(x.c, 12); }).join(" / ")
    + "</span></div>"

    + '<div class="ob" id="promptBody">' + esc(body || "（没有词）") + "</div>"
    + '<div class="of"><div class="tabs">' + tabs + "</div>"
    + '<span style="flex:1"></span>'
    + '<button class="btn p" data-act="copy" data-cp="' + esc(body || "") + '">复制本套</button></div>';

  /* 负面词 */
  if ((r.neg || []).length) {
    h += '<div class="chips"><span style="color:var(--rk-lookalike);border-color:#5c452a;background:#2a2118">'
      + "负面词 " + r.neg.length + " 条</span>"
      + r.neg.map(function (x) { return "<span>" + esc(x) + "</span>"; }).join("")
      /* 负面词单独一个复制按钮：跟正面词混在一条里，SD 用户粘进 Positive 框
         就把「不要文字」写成了「要文字」，而这四个模式的负面词第一条正是「文字」。 */
      + '<button class="btn neg" data-act="copy" data-cp="' + esc(negStrOf(r.neg))
      + '" title="SD 填 Negative 框，MJ 用 --no（本按钮已按平台带前缀）">复制负面词</button>'
      + "</div>";
  }
  h += "</div>";

  /* 身份层 / 内容层：把「哪些面来自谁」显式列一遍 ——
     这段是「换主题后身份层不变」这句话的可视证据。 */
  var idList = [], muList = [];
  FACES.forEach(function (f) {
    var x = r.faces[f.k];
    var line = f.zh + " ← " + ((x && x.c) ? x.from : "空面");
    if (f.group === "identity") idList.push(line); else muList.push(line);
  });
  h += '<div class="note" style="margin-top:8px"><b style="color:var(--ident)">身份层 · 来自编号，本号给的</b><br>'
    + esc(idList.join("　"))
    + '<br><b style="color:var(--content)">内容层 · 可被主题覆盖</b><br>'
    + esc(muList.join("　"))
    + "</div>";

  /* warns / rights / missing 分块显示 */
  h += '<div class="warns">';
  (r.warns || []).forEach(function (w) {
    h += '<div class="w">' + esc(w) + "</div>";
  });
  if (r.rights) {
    h += '<div class="w ok"><b>授权 ' + esc(r.rights.worst || "—") + "　</b>"
      + esc(r.rights.can || "") + (r.rights.items || []).map(function (i) {
        return esc(i.num + " " + i.zh);
      }).join("　")
      + (r.rights.disclaimer ? "<br>" + esc(r.rights.disclaimer) : "") + "</div>";
  }
  (r.missing || []).forEach(function (m) {
    h += '<div class="w"><b>缺 ' + esc(m.zh) + "　</b>"
      + esc(m.reason || "本号与主题都没给这一面 —— 空面出来的图像默认设置") + "</div>";
  });
  if (!(r.warns || []).length && !(r.missing || []).length) {
    h += '<div class="w ok">无警告：八面齐、无风险触发、授权档为 '
       + esc((r.rights || {}).worst || "—") + "</div>";
  }
  h += "</div>";

  /* 姓名声明在这一处再出现一次：任何出词的地方都要能看到 */
  h += '<div class="note" style="margin-top:8px">' + esc(r.notice || "") + "</div>";
  return h;
}

function renderGacha() {
  el("mainH").innerHTML = "抽卡<span class=\"hint\">随机组合 —— 不用先选任何东西，点「抽」就行</span>";
  var f = "";

  /* 抽卡的定位说明。它和精品出图是两种玩法：

     所以抽卡页不提供主题选择 —— 主题正是被随机的那根轴，

    + "或直接复制。想固定某根轴（比如锁定编号只换主题），"
    + "用每张卡上的锁。</div>";

  var pool = GACHA.pool(DB, {});
  f += '<div class="tkbox"><div class="tl">池规模 · 现算不缓存</div>'
    + '<div class="tkstat">'
    + pool.axes.map(function (a) {
        return '<div><span class="k">' + esc(a.zh) + "</span><span class=\"v\">"
          + a.n + " <small style=\"color:var(--ink3)\">条</small></span></div>";

    + '<div><span class="k">组合空间</span><span class="v"><b>' + pool.space + "</b></span></div>"

    + "</div>"
    + '<div class="sw2">'
    + '<label class="toggle' + (S.gSemantic ? " on" : "") + '" data-act="tsem">'
    + '<input type="checkbox"' + (S.gSemantic ? " checked" : "") + '>语义护栏 ' + (S.gSemantic ? "开" : "关")
    + "</label>"
    + '<label class="toggle' + (S.gForce ? " on" : "") + '" data-act="tforce">'
    + '<input type="checkbox"' + (S.gForce ? " checked" : "") + ">强制换模式 " + (S.gForce ? "开" : "关") + "</label>"
    + '<span style="font-size:11px;color:var(--ink3)">分类过滤</span>'
    + '<button class="fchip' + (S.gCat === "全部" ? " on" : "") + '" data-act="gcat" data-v="全部">全部分类</button>'
    + sortedCats(DB.ALBUM || []).map(function (c) {
        var n = (DB.ALBUM || []).filter(function (x) { return x.cat === c; }).length;
        return '<button class="fchip' + (S.gCat === c ? " on" : "") + '" data-act="gcat" data-v="' + esc(c)
          + '">' + esc(c) + "<small>" + n + "</small></button>";
      }).join("")
    + "</div>"
    + '<div class="note" style="margin-top:8px"><b>语义护栏</b>：按类目对判，'
    + "挡掉确实荒谬的组合（如「古典 × 都市日常」）。判据刻意保守 —— "
    + "太严会让抽卡退化成「只能抽到安全组合」，那和没抽卡一样。<br>"
    + "<b>强制换模式</b>：模式轴权重 0，默认不参与随机；"
    + "打开后每组都重抽模式，纯图模式可能因此变图文、海报。</div>"
    + "</div>";

  /* 冲突表：一条不解释的抽卡结果只会让人以为是随机噪声，而它其实是规则 */
  f += '<div class="tkbox"><div class="tl">语义冲突表 · CAT_CLASH</div>'
    + Object.keys(GACHA.CAT_CLASH || {}).map(function (k) {
        return '<div class="note warn" style="margin-top:5px"><b>' + esc(k) + "</b> 配不进 "
          + esc(GACHA.CAT_CLASH[k].join("、")) + "</div>";

  if (S.gRolls) {

    if (!R.ok) {

            return e.zh + (e.reason ? "：" + e.reason : "");

    } else {
      var blocked = R.rolls.reduce(function (a, r) { return a + (r.semanticBlocked || 0); }, 0);
      f += '<div class="tkbox"><div class="tl">本轮统计</div><div class="tkstat">'
        + '<div><span class="k">seed</span><span class="v"><b>' + R.baseSeed + "</b></span></div>"
        + '<div><span class="k">组数</span><span class="v">' + R.total + "</span></div>"
        + '<div><span class="k">重复</span><span class="v'
        + (R.dups ? " warnv" : "") + '"><b>' + R.dups + "</b> · " + (R.dupRate * 100).toFixed(0) + "%</span></div>"
        + '<div><span class="k">语义挡掉</span><span class="v'
        + (blocked ? " warnv" : "") + '"><b>' + blocked + "</b> 次</span></div>"
        + '<div><span class="k">护栏</span><span class="v">' + (S.gSemantic ? "开" : "关") + "</span></div>"
        + "</div>"
        + (R.dups ? '<div class="note warn" style="margin-top:8px"><b>重复率 '
          + (R.dupRate * 100).toFixed(0) + "%</b> —— 池子在这个过滤条件下太小，"
          + "抽出来的东西越抽越像。放宽分类过滤或关掉护栏可缓解。"
          + "如实报出来而不是假装每次都不一样。</div>" : "")
        + "</div>";

      f += '<div class="secthead"><h3>抽到的组合</h3><span class="n">' + R.rolls.length
        + " 组</span><span class=\"why\">锁住某一轴后重抽，只动没锁的那几轴</span></div>"
        + '<div class="row" style="margin-bottom:9px">'
        + '<button class="btn p" data-act="copyall">复制全部 ' + R.rolls.length + " 组</button>"
        + '<button class="btn" data-act="roll">全部重抽</button>'
        + '<span style="font-size:11px;color:var(--ink3)">'
        + "每张卡下面可单独换编号 / 换主题 / 换模式 / 整组重抽</span></div>"
        + '<div class="sgrid">' + R.rolls.map(rollCard).join("") + "</div>";

  }

  el("main").innerHTML = f;
}
/* 抽卡结果的 mode 候选有两种形状：
   非 forceMode 时 roll 返回 db.MODES 里的对象（有 k 没 id），
   forceMode 时返回 pool 的候选（有 id）。两种都要能取到模式名。 */
function modeIdOf(m) {
  if (!m) return "plain";
  return m.id || m.k || "plain";
}
/* 锁与重抽的两个小按钮。
   抽卡的乐趣在「换一个轴看看」而不是每次整组推翻重来，
   所以「只换主题」必须是一个单独的动作 ——
   只有「全部重抽」的话，抽十次也碰不到「同一个人换场景」的对比。 */
function lockBtn(i, axis, zh) {
  var on = !!(S.gLocks[i] && S.gLocks[i][axis]);
  return '<button class="mini' + (on ? " on" : "") + '" data-act="glock" data-i="' + i
    + '" data-axis="' + axis + '" title="锁住后，重抽不会换这一轴">锁' + zh + "</button>";
}
function reBtn(i, axis, zh) {
  return '<button class="mini" data-act="greroll" data-i="' + i + '" data-axis="' + axis
    + '">' + zh + "</button>";
}
function rollCard(r, i) {
  var res = r.result;
  var mid = modeIdOf(r.picked.mode);
  var mo = (DB.MODES || []).filter(function (m) { return m.k === mid; })[0] || {};
  var tags = (res && res.tags && res.tags.sd) || [];
  var th = r.picked.theme || {};
  return '<div class="scard">'
    + '<div class="st"><span class="pn">' + esc((r.picked.plate || {}).id || "—") + "</span>"
    + '<span class="tn">' + esc((r.picked.plate || {}).zh || "") + "</span>"
    + '<span class="sp"></span>'
    + (r.dup ? '<span class="sdup">重复</span>' : "") + "</div>"
    + '<div class="st" style="border-top:0"><span class="badge" style="color:#d9b988;border-color:var(--content-line);background:var(--content-soft)">'
    + esc(th.id || "—") + " " + esc(th.zh || "") + "</span>"
    + '<span class="badge">' + esc(mo.zh || mid) + "</span>"
    + '<span style="flex:1"></span>'
    + '<span style="font:10px var(--mono);color:var(--ink3)">seed ' + esc(r.seed) + "</span></div>"
    + (res && res.ok ? '<div class="sw" style="background:' + swatchOf(res.plate) + '"></div>'
      + '<div class="sb">' + esc(clip(tags.join("，"), 170)) + "</div>" : "")
    + '<div class="sf">'
    + (r.semanticBlocked
        ? '<span class="sdup" title="被语义护栏挡掉的候选数">挡 ' + r.semanticBlocked + "</span>" : "")
    + '<button class="btn k" data-act="use" data-num="' + esc((r.picked.plate || {}).id || "")
    + '" data-theme="' + esc(th.id || "") + '" data-mode="' + esc(mid) + '">用这组</button>'
    + '<button class="btn p" data-act="copy" data-cp="' + esc(tags.join("，"))
    + '" title="只复制正面词。负面词在「一键复制全部」里逐组给出">复制</button>'
    /* 这一组的负面词不能用编号去现算：那个算的是全局 S.theme/S.mode，
       而这一组的主题与模式是它自己抽到的。错配最典型的后果是
       图文组的「不要文字」被加到纯图组，模型照样加字。 */
    + '<button class="btn neg" data-act="rneg" data-i="' + i
    + '" title="复制这一组的负面词 —— SD 填 Negative 框，MJ 已带 --no">负面词</button>'
    + "</div>"
    + '<div class="sf lockbar">'
    + lockBtn(i, "plate", "编号") + lockBtn(i, "theme", "主题") + lockBtn(i, "mode", "模式")
    + '<span style="width:8px"></span>'
    + reBtn(i, "plate", "换编号") + reBtn(i, "theme", "换主题")
    + reBtn(i, "mode", "换模式") + reBtn(i, "all", "整组重抽")
    + "</div></div>";
}

/* 只动一个轴的重抽。
   实现方式：整组重抽一次，再把不该动的轴从旧组里换回来。
   为什么不「只对某一轴重新随机」：主题要过语义护栏，
   而护栏是按「这个编号配这个主题」判的 ——
   单独换主题就绕过了护栏，抽出来的组合可能正是被挡掉的那类。
   整组重抽再回填，护栏依然在链路里。 */
function rerollOne(i, axis) {
  var R = S.gRolls;
  if (!R || !R.ok || !R.rolls[i]) { toast("先抽一组"); return; }
  var old = R.rolls[i];
  var lock = S.gLocks[i] || {};
  var opt = { semanticOff: !S.gSemantic, forceMode: S.gForce,
              seed: Math.floor(Math.random() * 1e9) };
  if (S.gCat !== "全部") opt.cats = { plate: [S.gCat] };
  var fresh = GACHA.roll(DB, opt);
  if (!fresh.ok) { toast("重抽失败：" + (fresh.why || "未知")); return; }

  ["plate", "theme", "mode"].forEach(function (k) {
    var shouldKeep = (axis === "all") ? !!lock[k] : (k !== axis || !!lock[k]);
    if (shouldKeep && old.picked[k]) fresh.picked[k] = old.picked[k];
  });

  fresh.index = i;
  fresh.seed = old.seed;
  fresh.result = KIT.compose(DB, (fresh.picked.plate || {}).id, {
    themeId: (fresh.picked.theme || {}).id || null,
    mode: modeIdOf(fresh.picked.mode)
  });
  R.rolls[i] = fresh;
  render();
  toast(axis === "all" ? "整组重抽" : "只换了" + ({ plate: "编号", theme: "主题", mode: "模式" }[axis] || axis));
}

/* 一键复制全部：连着铺的 8 组，一次全带走。
   每组带编号 / 主题 / 模式三行抬头 ——
   只有词面的话，复制回去就分不清哪段是哪组了。 */
function copyAllRolls() {
  var R = S.gRolls;
  if (!R || !R.ok) { toast("先抽一组"); return; }
  var lines = [];
  R.rolls.forEach(function (r, i) {
    var res = r.result || {};
    var tags = (res.tags && res.tags[S.plat]) || [];
    var body = (S.plat === "nl") ? (res.nl || "") : tags.join("，");
    lines.push("— " + (i + 1) + "　" + ((r.picked.plate || {}).id || "")
      + " " + ((r.picked.plate || {}).zh || "")
      + " × " + ((r.picked.theme || {}).id || "") + " " + ((r.picked.theme || {}).zh || "")
      + " × " + modeIdOf(r.picked.mode) + "　seed " + r.seed);
    lines.push(body);
    /* 负面词逐组给，不合并成一条：
       每组的模式可能不同（模式负是负面词的主要来源），
       合并等于给其中几组配错的负面词 —— 而错配最典型的后果是
       图文组的「不要文字」被加到纯图组，模型照样加字。 */
    var ng = (res.neg || []);
    if (ng.length) lines.push("负面词（" + ng.length + " 条）：" + negStrOf(ng));
    lines.push("");
  });
  copyText(lines.join("\n"));
}

/* ============================================================
 * 五 授权与合规
 * ============================================================ */
function rightsBody() {
  /* 授权与合规的全部内容。抽成独立函数：

  /* 四档分级说明表 */

    + " 档</span><span class=\"why\">档位只影响发布，不影响使用</span></div>";
  f += '<div class="tiergrid">' + (DB.RIGHT_TIERS || []).map(function (t) {
    var n = byRt.m[t.k] || 0;
    return '<div class="trow"><div class="tk" style="color:' + t.color + ";border-color:" + t.color

      + '<span class="dv">' + (n / A.length * 100).toFixed(1) + "%</span></div>"
      + "</div></div>";
  }).join("") + "</div>";

  /* 全库按档位分布：编号 × 档位的交叉表 */
  f += '<div class="secthead"><h3>全库分布</h3><span class="n">' + A.length + ' 条编号</span>'

  /* 风险四档 */

  f += (DB.RISK_KINDS || []).map(function (r) {

    f += '<div class="note hard">' + esc(insp.disclaimer || "") + "</div>";
  }
  f += '<div class="note">另：内部分级只覆盖「是否指向可识别真人」这一维。'
    + "商标、艺术品、场所形象、他人肖像权，以及各平台自己的社区规范，"
    + "都不在本库的判定范围内。发布前请自行复核。</div>";

  return f;

function renderRights() {

/* ============================================================
 * 六 自定义出图
 *
 * 离线版的自问自答：**为什么这一页不调模型出图。**
 * 本库是「双击 index.html 就能用」的离线库，不联网、不装密钥。
 * 真出图要密钥，一旦要密钥，这个库就不是离线的了 ——
 * 所以这一页的产出是**一条可以直接贴进任何生图模型的提示词**，
 * 而不是一张图。名字叫「出图」，指的是「配好出图要用的那一句话」。
 *
 * 三条纪律：
 *   1. 用户原话是**追加**，不是覆盖。它拼在词面末尾，不参与冲突裁决 ——
 *      参与裁决的话，「我要一张悲伤的图」就会去改骨相，
 *      而那是身份层，改了就不是同一个人了。
 *   2. 自动配必须给出**命中了什么词**。只给结果不给理由，
 *      用户无法判断该不该信；而猜错的推荐被照抄，比没有推荐更糟。
 *   3. 没命中就直说没命中，不偷偷给随机结果。
 * ============================================================ */
var RATIOS = [
  { k:"3:4",  zh:"竖 3:4",  mj:"--ar 3:4",  word:"vertical portrait framing, 3:4 aspect ratio", nl:"竖构图 3:4" },
  { k:"2:3",  zh:"竖 2:3",  mj:"--ar 2:3",  word:"vertical portrait framing, 2:3 aspect ratio", nl:"竖构图 2:3" },
  { k:"1:1",  zh:"方 1:1",  mj:"--ar 1:1",  word:"square composition, 1:1 aspect ratio", nl:"方形构图 1:1" },
  { k:"4:3",  zh:"横 4:3",  mj:"--ar 4:3",  word:"horizontal composition, 4:3 aspect ratio", nl:"横构图 4:3" },
  { k:"16:9", zh:"横 16:9", mj:"--ar 16:9", word:"wide cinematic composition, 16:9 aspect ratio", nl:"宽幅构图 16:9" },
  { k:"auto", zh:"不指定",  mj:"",          word:"", nl:"" }
];
function ratioOf(k) {
  return RATIOS.filter(function (r) { return r.k === k; })[0] || RATIOS[0];
}

/* 把一句中文切成可匹配的片段，分两级：
     exact —— 原文里的自然片段（按标点切出来的词与短句）
     loose —— 长片段再切出来的二字滑窗
   为什么要分两级而不是混在一起：二字滑窗会产生「红机」「械义」这类
   跨越词界的碎片，它们经常碰巧命中某条数据 ——
   于是「紫红机械义肢独角兽」这种库里根本没有的东西也能配出推荐，
   而界面上只看得到「命中 3 处」，看不出这 3 处是碎片碰中的。
   所以先用自然片段匹配，一段都没命中才降级到滑窗，并且**降级要标明**。 */
function splitTerms(text) {
  var raw = String(text || "")
    .split(/[\s，,。；;、：:！!？?（）()「」【】《》\n\r\/·]+/)
    .filter(function (t) { return t.length >= 2; });
  var exact = raw.slice();
  var loose = [];
  raw.forEach(function (t) {
    if (t.length > 4) {
      for (var i = 0; i + 2 <= t.length && i < 14; i++) loose.push(t.substr(i, 2));
    }
  });
  function uniq(a) { return a.filter(function (t, i, x) { return x.indexOf(t) === i; }); }
  return { exact: uniq(exact), loose: uniq(loose) };
}
function hitsOf(hay, terms) {
  var hit = [];
  terms.forEach(function (t) { if (hay.indexOf(t) >= 0) hit.push(t); });
  /* 去重：同一个词在多面里重复命中不该重复计分 */
  return hit.filter(function (t, i, a) { return a.indexOf(t) === i; });
}
function plateHay(p) {
  var a = [p.zh || "", p.en || "", p.cat || "", p.read || "", p.light || "", p.camera || ""];
  FACES.forEach(function (f) {
    var v = (p.faces || {})[f.k];
    if (v) a.push(v.c || v);
  });
  return a.join(" ").toLowerCase();
}
function themeHay(t) {
  var a = [t.zh || "", t.cat || "", t.text || ""];
  FACES.forEach(function (f) {
    var v = (t.faces || {})[f.k];
    if (v) a.push(v.c || v);
  });
  return a.join(" ").toLowerCase();
}
function autoMatch(text) {
  var sp = splitTerms(text);
  if (!sp.exact.length) {
    return { ok: false, why: "没读到可匹配的片段（至少写两个字的中文）" };
  }
  function run(terms) {
    var ps = (DB.ALBUM || []).map(function (p) {
      var h = hitsOf(plateHay(p), terms);
      return { p: p, n: h.length, hit: h.slice(0, 4) };
    }).filter(function (x) { return x.n > 0; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 3);
    var ts = (DB.THEMES || []).map(function (t) {
      var h = hitsOf(themeHay(t), terms);
      return { t: t, n: h.length, hit: h.slice(0, 4) };
    }).filter(function (x) { return x.n > 0; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 3);
    return { plates: ps, themes: ts, terms: terms };
  }
  var a = run(sp.exact.map(lower1));
  if (a.plates.length || a.themes.length) {
    return { ok: true, level: "exact", terms: sp.exact,
             plates: a.plates, themes: a.themes };
  }
  var b = run(sp.exact.concat(sp.loose).map(lower1));
  return { ok: true, level: "loose", terms: sp.exact.concat(sp.loose),
           plates: b.plates, themes: b.themes,
           empty: (!b.plates.length && !b.themes.length) };
}
function lower1(s) { return String(s).toLowerCase(); }

function customBody(r) {

/* ============================================================
 * 七 全部词条
 *
 * 为什么单独开一页：抽卡与工作台都在「组合」，
 * 而使用者的另一半需求是「我只想看看库里到底有什么」。
 * 藏在组合界面后面的词条等于不存在。
 * ============================================================ */
/* ============================================================
 * 八 体检
 *
 * 这一页的四条检查**每次打开现跑一遍**，不是写死的结论。
 * 写死的「已通过」在库改动那天就开始骗人；
 * 而体检页的全部价值就是「现在这一刻还成不成立」。
 * ============================================================ */
function runChecks() {
  var out = [];
  var A = DB.ALBUM || [];

  /* ① 身份层填充。
     为什么只查身份层而不是「八面」：scene 面**本来就该由主题给**，
     编号不填 scene 是设计如此（填了反而会被主题覆盖，白填）。
     拿「八面齐全」当标准，48 条会全军覆没 ——
     而那是检查写错了，不是数据有缺口。
     这类「判据本身就错」的失败最危险：它报红，看起来很负责，
     但照着它去补数据，补出来的是一堆马上会被覆盖的死字段。 */
  var gaps = [];
  A.forEach(function (p) {
    var miss = (DB.IDENTITY_FACES || []).filter(function (k) {
      var v = (p.faces || {})[k];
      return !(v && (v.c || v));
    });
    if (miss.length) gaps.push(p.num + " 缺 " + miss.join("、"));
  });
  var dressFill = A.filter(function (p) {
    var v = (p.faces || {}).dress;
    return !!(v && (v.c || v));
  }).length;
  out.push({
    zh: "身份层填充", ok: gaps.length === 0,
    v: (A.length - gaps.length) + " / " + A.length + " 条编号身份层五面齐全",
    d: gaps.length ? "缺口：" + gaps.slice(0, 6).join("；")
      : "身份层五面全部填满（scene 面由主题给，不在这里计缺口；"
        + dressFill + "/" + A.length + " 条给了默认妆造，主题覆盖时不用它）"
  });

  /* ② 身份层恒定：真换主题比对，不是读声明 */
  var bad = [];

}

/* ---------- 组图 ----------

   两条路都留着：勾选是「我已经想好了」，全量是「这一号能配什么我都想看看」。 */
function doSweep() {
  var picked = Object.keys(S.swPicked).filter(function (k) { return S.swPicked[k]; });
  if (picked.length) {
    S.swOut = KIT.series(DB, S.num, picked, { mode: S.mode, medium: S.medium });
    S.swOut.why = "按勾选的 " + picked.length + " 个主题";
  } else {
    var cats = S.swCat === "全部" ? null : [S.swCat];
    S.swOut = GACHA.sweep(DB, S.num, { mode: S.mode, medium: S.medium, cats: cats });
    S.swOut.why = "按类目「" + S.swCat + "」全量 sweep";
  }

/* ---------- 抽卡 ---------- */
function doRoll() {
  var opt = {
    semanticOff: !S.gSemantic,
    forceMode: S.gForce
  };
  if (S.gCat !== "全部") opt.cats = { plate: [S.gCat] };
  if (S.gSeed !== "") {
    var n = parseInt(S.gSeed, 10);
    opt.seed = isNaN(n) ? S.gSeed : n;      /* 非数字也能当种子：mulberry 自己会 |0 */
  }
  S.gRolls = GACHA.rollMany(DB, S.gN, opt);
  render();
  if (S.gRolls.ok) toast("抽了 " + S.gRolls.total + " 组 · seed " + S.gRolls.baseSeed);

/* ---------- 事件委托 ----------

     于是「点详情里的复制按钮」会变成「关掉浮层」。 */

  /* 手动复制框同理：点空白处关闭，不逼人去够右上角那个小按钮。 */

  if (a === "ftier") { S.tier = v; render(); return; }
  if (a === "frk")   { S.rk = v;   render(); return; }
  if (a === "fregion") { S.region = v; render(); return; }

  if (a === "roll")   { doRoll(); return; }
  if (a === "use") {
    S.num = t.getAttribute("data-num");
    var thId = t.getAttribute("data-theme");
    if (thId) S.theme = thId;
    S.mode = t.getAttribute("data-mode") || "plain";
    S.det = false;
    go("bench");
    toast("已送进工作台");
    return;
  }

  /* ---- 详情浮层 ---- */
  if (a === "detclose") { closeDetail(); return; }
  if (a === "pzclose") { closePic(); return; }
  if (a === "pzbench") {
    S.num = t.getAttribute("data-num") || S.num;
    closePic(); closeDetail();
    go("bench");
    return;
  }
  /* 点图看原图。与「点卡片看详情」分成两个动作：
     两个意图塞进同一个手势的结果是，每次想看详情都被弹到大图上。 */
  if (a === "zoompic") {
    openPic(t.getAttribute("data-num"));
    return;
  }
  if (a === "cclose") { closeCopyBox(); return; }
  if (a === "csel") {
    var ct = el("cmText");
    if (ct) { try { ct.focus(); ct.select(); } catch (e) {} }
    return;
  }
  if (a === "detbench") { S.det = false; go("bench"); return; }

  /* ---- 抽卡：锁轴 / 只换一个轴 / 一键复制全部 ---- */
  if (a === "glock") {
    var gi = parseInt(t.getAttribute("data-i"), 10);
    var gx = t.getAttribute("data-axis");
    if (!S.gLocks[gi]) S.gLocks[gi] = {};
    S.gLocks[gi][gx] = !S.gLocks[gi][gx];
    render();
    return;
  }
  if (a === "greroll") {
    rerollOne(parseInt(t.getAttribute("data-i"), 10), t.getAttribute("data-axis"));
    return;
  }
  if (a === "copyall") { copyAllRolls(); return; }

  /* ---- 自定义出图 ---- */
  if (a === "cauto") {
    S.cAuto = autoMatch(S.cText);
    if (S.cAuto.ok) {
      /* 自动配只填「还没选过」的那一格，不覆盖用户已经手选的。
         覆盖了的话，用户手选完再点自动配，选择就被悄悄改掉了。 */
      if (S.cAuto.plates.length && !S.cNum) S.cNum = S.cAuto.plates[0].p.num;
      if (S.cAuto.themes.length && !S.cTheme) S.cTheme = S.cAuto.themes[0].t.num;
    }
    render();
    toast(S.cAuto.ok ? "配好了 —— 候选与命中词在左边" : (S.cAuto.why || "没读到可匹配的词"));
    return;
  }
  if (a === "cclear") { S.cText = ""; S.cAuto = null; render(); return; }
  /* cnum 与 pnum 同一套行为：选完收起分组，选中本身留在常显位。
     两处行为不一致时，人在这一页选完会以为「怎么没选上」。 */
  if (a === "cnum") {
    S.cNum = n; render();
    document.querySelectorAll("details.bseg[open]").forEach(function (d) { d.open = false; });
    return;
  }
  if (a === "ctheme") { S.cTheme = n; render(); return; }
  if (a === "cmode")  { S.cMode = v; render(); return; }
  if (a === "cmedium") { S.cMedium = v; render(); return; }
  if (a === "cratio") { S.cRatio = v; render(); return; }
  if (a === "cappe")  { S.cAppend = !S.cAppend; render(); return; }
  if (a === "cbench") {
    if (S.cNum) S.num = S.cNum;
    if (S.cTheme) S.theme = S.cTheme;
    S.mode = S.cMode;
    S.det = false;
    go("bench");
    return;
  }

  /* ---- 全部词条 ---- */
  if (a === "lxtab") { S.lxTab = v; render(); return; }
}, false);

/* 搜索框防抖：48 条卡整页重绘，每敲一个字符就重绘会明显发涩。
   120ms 足够吃掉连击。重绘后必须把焦点放回原框末尾，
   否则每敲一个字焦点就跑了，根本没法连续输入。 */
var searchTimer = null;
document.addEventListener("input", function (ev) {
  var id = ev.target && ev.target.id;
  if (id === "gq") {
    var v = ev.target.value;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      S.q = v;
      renderGallery(); renderNav();
      var box = document.getElementById("gq");
      if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
    }, 120);
    return;
  }
  /* 需求输入框只存值、不重绘：重绘会重建这个 textarea，
     每敲一个字焦点就丢了，根本没法连续输入。
     配对的动作是点「自动配」，不是边打字边配。 */
  if (id === "ctext") { S.cText = ev.target.value; return; }
  if (id === "gseed") { S.gSeed = ev.target.value; return; }
  if (id === "gn") {
    var n = parseInt(ev.target.value, 10);
    S.gN = isNaN(n) ? 1 : Math.max(1, Math.min(24, n));
    return;
  }
}, false);

/* 下拉必须走 change，不能挂在 input 上：
   select 在浏览器里两个事件都发，但不能指望 —— 把它写进 input 监听，
   一旦哪天只有一个事件到位，下拉就成了「选了没反应」。
   没反应的下拉比没有下拉更糟：它会让人以为复制用的就是这个主题，其实没变。 */
document.addEventListener("change", function (ev) {
  var id = ev.target && ev.target.id;
  if (id === "gtheme") { S.theme = ev.target.value; render(); return; }
}, false);

/* ---------- 兜底：任何未捕获异常都要看得见 ----------
   一个静默失败的界面比一个报错的界面危险得多：
   报错至少会让人停下来说一句「这里坏了」，
   而静默失败只会让人以为配方就是这样，然后照着错的去出图。 */
window.addEventListener("error", function (ev) {
  console.error("[beauty-album] 未捕获异常：", ev.error || ev.message);
  toast("界面出错：" + (ev.message || "未知错误") + "（详见控制台）");
});

/* ============================================================
 * 启动
 * ============================================================ */

/* RIGHTS 的浏览器路径必须在这里显式验证一次。
   album-kit.js 里的 `var RIGHTS = window.RIGHTS || null` 取的是
   同一个全局绑定 —— 而 data-core.js 也声明过一个叫 RIGHTS 的容器数组，
   rights.js 加载时把它覆盖成模块对象。顺序对了才拿得到 inspect。
   拿不到时 album-kit 不报错，只是 out.rights 退化成
   {worst, can:"", disclaimer:""}，表现是「授权徽章全空但页面一切正常」。
   所以这个断言不能省。 */
function verifyRights() {
  if (!RIGHTS || typeof RIGHTS.inspect !== "function") {
    console.error("[beauty-album] RIGHTS 没拿到 rights.js 的模块："
      + "检查 index.html 里 rights.js 必须在 album-kit.js 之前");
    return false;
  }
  var r = KIT.compose(DB, S.num, { themeId: S.theme, mode: S.mode, medium: S.medium });
  var ok = r.ok && r.rights && Array.isArray(r.rights.items) && r.rights.items.length > 0;
  if (!ok) {
    console.error("[beauty-album] compose 未走 RIGHTS.inspect —— out.rights 缺少 items");
    return false;
  }
  return true;
}

try {
  /* reindex 必须在任何取词之前：plate()/themeOf() 直接查 IDX，
     不建索引的话全部返回 null，而表现只是「点了没反应」。 */
  KIT.reindex(DB);
} catch (e) {
  console.error("[beauty-album] reindex 失败：", e);
}
var RIGHTS_OK = verifyRights();

/* 自定义出图给一个默认编号：空页进来只有一个「先选编号」的提示，
   而使用者第一次打开这一页时还没选过任何东西 ——
   给个默认值不替他做决定，只是让页面立刻可用。 */
if (!S.cNum) S.cNum = (DB.ALBUM[0] || {}).num;

renderHeader();
render();

/* 给 smoke_ui.js 用的一组只读钩子。
   测试需要断言「换主题后身份层不变」这类跨状态的事实，
   而这些事实在 DOM 上看不到 —— 它们住在 compose 的返回值里。 */
window.ALBUMUI = {
  S: S, DB: DB, KIT: KIT, GACHA: GACHA, RIGHTS: RIGHTS,
  RIGHTS_OK: RIGHTS_OK,
  go: go, render: render,
  composeNow: composeNow,
  gcopyText: gcopyText, gcopyNote: gcopyNote, gcopyOn: gcopyOn,
  gcopyNeg: gcopyNeg, negStrOf: negStrOf,
  GCOPY_PILOT: GCOPY_PILOT,
  copyText: copyText, fallbackCopy: fallbackCopy,
  manualCopyBox: manualCopyBox, closeCopyBox: closeCopyBox,
  /* 新页的钩子：体检与自动配都是「现算」的，
     它们在 DOM 上看不见全貌，只能从返回值断言。 */
  openDetail: openDetail, closeDetail: closeDetail,
  autoMatch: autoMatch, splitTerms: splitTerms,
  rerollOne: rerollOne, copyAllRolls: copyAllRolls,
  runChecks: runChecks, customBody: customBody,
  identityFaces: function () {
    var r = composeNow();
    var m = {};
    (DB.IDENTITY_FACES || []).forEach(function (k) {
      m[k] = (r.faces[k] || {}).c || null;
    });
    return m;
  },
  galleryList: galleryList
};

console.log("[beauty-album] 界面已装载：编号 " + (DB.ALBUM || []).length
  + " 条 / 主题 " + (DB.THEMES || []).length + " 个 / 模式 "
  + (DB.MODES || []).length + " 种 · 身份层 " + (DB.IDENTITY_FACES || []).length
  + " 面 · 授权分级 " + (RIGHTS_OK ? "已挂载" : "未挂载"));

})();
</script>
</body>
</html>
